<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Closet Swap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@300..600&display=swap">
<style>
/* Layout: editorial masthead + Pinterest masonry; pieces sit on seamless "paper" like a lookbook, hang-tags carry size, care-label cards carry the AI's labels. */
:root{
  --bg:#FFFFFF; --paper:#F7F4FC; --card:#FFFFFF;
  --ink:#26212E; --ink-2:#6B6478; --ink-3:#A39DB0;
  --wine:#7B4FD0; --wine-ink:#FFFFFF; --wine-soft:#946BE0;
  --blush:#ECE3FB; --blush-2:#F6F1FE; --beige:#EFEBF5; --taupe:#C7BCDA;
  --line:#ECE7F4; --shadow:0 1px 2px rgba(55,35,90,.05),0 8px 24px -12px rgba(55,35,90,.18);
  --ok:#4E6B52; --ok-bg:#E3EBE1; --warn:#8C5A1E; --warn-bg:#F4E7D3;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --r:14px; color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;font-weight:400;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Nav ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:28px;height:68px}
.brand{font-family:var(--display);font-style:italic;font-size:28px;text-decoration:none;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px;white-space:nowrap}
.brand b{font-style:normal;font-weight:500;color:var(--wine)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:14.5px;color:var(--ink-2);transition:color .2s,background .2s}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);background:var(--blush-2)}
.tab .badge{min-width:18px;height:18px;border-radius:9px;background:var(--wine);color:var(--wine-ink);font-size:11px;display:inline-grid;place-items:center;padding:0 5px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 22px;font-size:14.5px;font-weight:500;letter-spacing:.02em;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--wine);color:var(--wine-ink)}
.btn-primary:hover{background:var(--wine-soft)}
.btn-ghost{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--ink);color:var(--bg)}
.btn-quiet{background:var(--blush-2);color:var(--ink)}
.btn-quiet:hover{background:var(--blush)}
.btn-sm{padding:8px 16px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav-add{padding:10px 18px}
@media (max-width:860px){
  .top .wrap{height:60px}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:25}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;border-radius:10px;position:relative}
  .tab .badge{position:absolute;top:0;right:4px;min-width:16px;height:16px;font-size:10px}
  .nav-add{margin-left:auto}
  .top .wrap{gap:10px}
  .brand{font-size:24px}
  main{padding-bottom:84px}
}

/* ---------- Generic sections ---------- */
main{padding-block:28px 80px}
.view{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sec{margin-top:72px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sec-head h2{font-size:clamp(30px,4vw,44px);line-height:1.05}
.sec-head h2 em{color:var(--wine)}
.link{color:var(--wine);text-decoration:none;font-size:14.5px;font-weight:500;border-bottom:1px solid currentColor;padding-bottom:1px}
.page-head{padding-block:24px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.page-head h1{font-size:clamp(44px,7vw,88px);line-height:.95}
.page-head h1 em{color:var(--wine)}
.page-head p{max-width:46ch;margin:14px 0 0}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:28px 12px}
.hero h1{font-size:clamp(52px,7.6vw,112px);line-height:.92;letter-spacing:-.025em}
.hero h1 em{font-style:italic;color:var(--wine)}
.hero p{font-size:19px;max-width:40ch;color:var(--ink-2);margin:26px 0 34px;font-weight:300}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-meta{display:flex;gap:10px;align-items:center;margin-top:36px;font-size:14px;color:var(--ink-2)}
.faces{display:flex}
.faces .mono{margin-left:-8px;border:2px solid var(--bg)}
.faces .mono:first-child{margin-left:0}
.collage{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.collage .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.collage figure{margin:0;position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--paper)}
.collage img{display:block;width:100%;height:auto}
.collage .col:last-child{margin-top:44px}
.collage figcaption{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.35;max-width:calc(100% - 24px)}
.collage figcaption b{display:block;font-family:var(--display);font-weight:500;font-size:14.5px}
.stamp{position:absolute;top:-18px;right:-8px;width:104px;height:104px;border-radius:50%;background:var(--wine);color:var(--wine-ink);display:grid;place-items:center;text-align:center;font-family:var(--display);font-style:italic;font-size:15px;line-height:1.1;transform:rotate(-10deg);box-shadow:var(--shadow);z-index:2;padding:12px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:36px}.stamp{width:84px;height:84px;font-size:13px;right:4px}}

/* ---------- Pinned welcome, clothes scroll over it ---------- */
.hero-pin{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:0;text-align:center;padding-block:56px 88px;display:flex;flex-direction:column;align-items:center}
.hero-pin h1{font-size:clamp(50px,8.4vw,124px);line-height:.92;letter-spacing:-.025em;margin-top:18px;max-width:12ch}
.hero-pin h1 em{font-style:italic;color:var(--wine)}
.hero-pin p{font-size:19px;max-width:40ch;color:var(--ink-2);margin:24px auto 32px;font-weight:300}
.hero-pin .hero-cta{justify-content:center}
.over{position:relative;z-index:1;background:var(--bg);padding-top:8px}
.over::before{content:"";position:absolute;left:0;right:0;top:-56px;height:56px;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg));pointer-events:none}
.strip{columns:4 220px}
.strip-foot{display:flex;justify-content:center;margin-top:6px}
.over .ledger{margin-top:48px}
@media (max-width:860px){.hero-pin{top:calc(env(safe-area-inset-top,0px) + 60px);padding-block:36px 72px}.hero-pin p{font-size:17px}.strip{columns:2 150px;column-gap:14px}}
/* ---------- Ledger (summary) ---------- */
.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin-top:56px}
.ledger a{display:block;padding:22px 22px 24px;text-decoration:none;border-left:1px solid var(--line);transition:background .25s}
.ledger a:first-child{border-left:0;padding-left:0}
.ledger a:hover{background:var(--blush-2)}
.ledger a:first-child:hover{background:transparent}
.ledger .n{font-family:var(--display);font-size:clamp(44px,5vw,64px);line-height:1;margin:10px 0 6px;font-variant-numeric:lining-nums tabular-nums}
.ledger .n small{font-size:.35em;font-family:var(--sans);color:var(--ink-2);margin-left:6px;letter-spacing:.02em}
.ledger .sub{font-size:14px;color:var(--ink-2)}
.ledger .hot .n{color:var(--wine)}
@media (max-width:760px){.ledger{grid-template-columns:1fr 1fr}.ledger a:nth-child(3){border-left:0;padding-left:0}.ledger a:nth-child(n+3){border-top:1px solid var(--line)}}

/* ---------- Masonry pins ---------- */
.masonry{columns:4 260px;column-gap:20px}
.pin{break-inside:avoid;margin:0 0 26px;display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;position:relative}
.pin-media{position:relative;border-radius:var(--r);overflow:hidden;background:var(--paper);box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
.pin-media img{display:block;width:100%;height:auto;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.pin:hover .pin-media{transform:translateY(-3px);box-shadow:0 2px 4px rgba(55,35,90,.06),0 18px 38px -16px rgba(55,35,90,.35)}
.pin:hover .pin-media img{transform:scale(1.035)}
.pin-meta{padding:12px 2px 0;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pin-meta h3{font-size:19px;line-height:1.2}
.pin-meta p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2)}
.pin-meta .min{min-width:0}
.hangtag{position:absolute;top:12px;left:12px;z-index:2;background:var(--card);color:var(--ink);font-size:11.5px;font-weight:500;letter-spacing:.08em;padding:5px 9px 5px 18px;border-radius:4px 10px 10px 4px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hangtag::before{content:"";position:absolute;left:7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--taupe)}
.save{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;opacity:0;transform:translateY(-4px);transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.save svg{width:16px;height:16px}
.pin:hover .save,.pin:focus-visible .save{opacity:1;transform:none}
.save.on{opacity:1;transform:none;color:var(--wine)}
.save.on svg{fill:currentColor}
@media (hover:none){.save{opacity:1;transform:none}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;letter-spacing:.03em;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--blush-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.out{background:var(--warn-bg);color:var(--warn)}
.pill.in{background:var(--ok-bg);color:var(--ok)}
.pill.wine{background:var(--blush);color:var(--wine)}
.pill.plain::before{display:none}
.status-on-media{position:absolute;left:12px;bottom:12px;z-index:2}

/* Swatch garments for friends' sample closets */
.swatch{position:relative;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,var(--card),var(--paper) 70%)}
.swatch.h1{aspect-ratio:4/5}.swatch.h2{aspect-ratio:3/4}.swatch.h3{aspect-ratio:1/1}.swatch.h4{aspect-ratio:2/3}
.swatch::after{content:"";position:absolute;left:24%;right:24%;bottom:7%;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(55,35,90,.16),transparent)}
.garment{position:relative;width:62%;height:80%;filter:drop-shadow(0 6px 10px rgba(55,35,90,.12));-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;z-index:1}
.garment::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.28),transparent 38%,transparent 62%,rgba(0,0,0,.14))}
.sh-dress{-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M37 4h2.4l3 24.5h15.2l3-24.5H63l2.2 27.5c5 8 6.4 14.3 7.6 22C76 75 81 99 86 125H14c5-26 10-50 13.2-71.5 1.2-7.7 2.6-14 7.6-22z'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M37 4h2.4l3 24.5h15.2l3-24.5H63l2.2 27.5c5 8 6.4 14.3 7.6 22C76 75 81 99 86 125H14c5-26 10-50 13.2-71.5 1.2-7.7 2.6-14 7.6-22z'/></svg>")}
.sh-top{-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M33 22l10-6c3 5 11 5 14 0l10 6 17 15-9 10-7-6v58H32V41l-7 6-9-10z'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M33 22l10-6c3 5 11 5 14 0l10 6 17 15-9 10-7-6v58H32V41l-7 6-9-10z'/></svg>")}
.sh-skirt{-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M29 22h42l2 9 14 81c-25 7-49 7-74 0l14-81z'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M29 22h42l2 9 14 81c-25 7-49 7-74 0l14-81z'/></svg>")}
.sh-pants{-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M29 6h42l9 120H57L50 42l-7 84H20z'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M29 6h42l9 120H57L50 42l-7 84H20z'/></svg>")}
.sh-jacket{-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M35 12l9-4 6 20 6-20 9 4 18 10 9 80-13 2-6-52v66H27V52l-6 52-13-2 9-80z'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M35 12l9-4 6 20 6-20 9 4 18 10 9 80-13 2-6-52v66H27V52l-6 52-13-2 9-80z'/></svg>")}
.sh-bag{-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M36 52V40a14 14 0 0 1 28 0v12' fill='none' stroke='black' stroke-width='5'/><path d='M20 52h60l6 58H14z'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M36 52V40a14 14 0 0 1 28 0v12' fill='none' stroke='black' stroke-width='5'/><path d='M20 52h60l6 58H14z'/></svg>")}
.sh-scarf{-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M12 34h76L50 112z'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'><path d='M12 34h76L50 112z'/></svg>")}
.pat-satin{background:linear-gradient(115deg,var(--c1) 0%,var(--c2) 30%,var(--c1) 52%,var(--c2) 78%,var(--c1) 100%)}
.pat-gingham{background-color:var(--c2);background-image:linear-gradient(90deg,color-mix(in srgb,var(--c1) 60%,transparent) 50%,transparent 50%),linear-gradient(color-mix(in srgb,var(--c1) 60%,transparent) 50%,transparent 50%);background-size:12px 12px}
.pat-rib{background:repeating-linear-gradient(90deg,var(--c1) 0 3px,var(--c2) 3px 5px)}
.pat-pin{background:repeating-linear-gradient(90deg,var(--c1) 0 9px,var(--c2) 9px 10px)}
.pat-stripe{background:repeating-linear-gradient(90deg,var(--c1) 0 7px,var(--c2) 7px 14px)}
.pat-polka{background:radial-gradient(var(--c2) 22%,transparent 25%) 0 0/13px 13px,var(--c1)}
.pat-denim{background:repeating-linear-gradient(45deg,var(--c1) 0 2px,var(--c2) 2px 3px)}
.pat-leather{background:radial-gradient(circle at 32% 18%,var(--c2),var(--c1) 58%)}
.pat-linen{background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),var(--c1)}

/* ---------- Friends row & filters ---------- */
.mono{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-style:italic;font-size:16px;background:var(--blush);color:var(--wine);flex:none}
.mono.lg{width:64px;height:64px;font-size:24px}
.mono.me{background:var(--wine);color:var(--wine-ink)}
.friends{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin:28px 0 8px;scrollbar-width:none}
.friends::-webkit-scrollbar{display:none}
.friend{display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;transition:border-color .2s,background .2s;flex:none;text-align:left}
.friend:hover{border-color:var(--taupe)}
.friend[aria-pressed="true"]{border-color:var(--wine);background:var(--blush-2)}
.friend b{display:block;font-weight:500;font-size:14.5px;line-height:1.2}
.friend span{font-size:12.5px;color:var(--ink-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 30px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 15px;font-size:13.5px;cursor:pointer;color:var(--ink-2);transition:.2s}
.chip:hover{color:var(--ink);border-color:var(--taupe)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.refine{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:-14px 0 30px}
.pick{position:relative;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card);transition:border-color .2s}
.pick:hover{border-color:var(--taupe)}
.pick.on{border-color:var(--wine);background:var(--blush-2)}
.pick select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:8px 34px 8px 15px;font-size:13.5px;cursor:pointer;outline:none;color:var(--ink)}
.pick::after{content:"";position:absolute;right:15px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:rotate(45deg);pointer-events:none}
.pick:focus-within{outline:2px solid var(--wine);outline-offset:2px}
.refine .clear{border:0;background:none;color:var(--wine);font-size:13.5px;font-weight:500;cursor:pointer;padding:6px}
.refine .count{font-size:13.5px;color:var(--ink-3);margin-left:auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}

const fmt = s => parse(s).toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
const daysTo = s => Math.round((parse(s) - today()) / 864e5);
const sinceText = s => { const n = -daysTo(s); if (n <= 0) return "since today"; return `${n} day${n===1?"":"s"}`; };

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const nextWeekend = () => { const d = today(); const add = (5 - d.getDay() + 7) % 7 || 7; const f = new Date(d); f.setDate(d.getDate()+add); const s = new Date(f); s.setDate(f.getDate()+2); return [iso(f), iso(s)]; };

/* ============ Size / color / sort filters ============ */
const COLOR_FAMILIES = [
  ["White",/white|ivory|cream|oat/i],["Black",/black/i],["Pink",/pink|blush/i],["Red",/red|cherry|merlot|burgundy|wine/i],
  ["Orange",/orange|coral|peach/i],["Gold",/gold|yellow|champagne/i],["Silver",/silver|gray|grey|charcoal/i],
  ["Blue",/blue|navy|denim|sky/i],["Green",/green|olive|sage/i],["Purple",/purple|lilac|lavender|violet|orchid/i],["Brown",/brown|tan|cognac|camel|beige|leopard/i]
];
const DOTS = { White:"#F4F1EA", Black:"#1E1B1C", Pink:"#F08AA6", Red:"#D61F3D", Orange:"#F4845F", Gold:"#C9A23E", Silver:"#B9B2A8", Blue:"#4F86D9", Green:"#7BA05B", Purple:"#8E55C7", Brown:"#8B5A36" };
const colorFamily = c => (COLOR_FAMILIES.find(([,re]) => re.test(c||""))||["Other"])[0];
const PRINT_RE = /print|leopard|cheetah|zebra|snake|floral|flower|stripe|gingham|plaid|check|polka|dot|paisley|tie.?dye/i;
const METAL_RE = /metallic|sequin|silver|gold|shimmer|sparkle|glitter|lurex|chrome|beaded/i;
const colorTags = it => { const t = new Set([colorFamily(it.color)]); const txt = `${it.name} ${it.color} ${it.description||""}`;
  if (PRINT_RE.test(txt)) t.add("Print"); if (METAL_RE.test(txt)) t.add("Metallic"); t.delete("Other"); return t; };
const popularity = it => exchanges().filter(x => x.itemId===it.id).length*2 + (state.saved.has(it.id)?1:0) + (it.pop||0);
function refine(list){
  let out = list.filter(i => (!state.fSize || i.size===state.fSize) && (!state.fColor || colorTags(i).has(state.fColor)));
  const order = new Map(list.map((it,i)=>[it.id,i]));
  const rec = it => it.createdAt ? 1e13 + Date.parse(it.createdAt) : -order.get(it.id);
  out = out.slice().sort(state.fSort==="popular" ? (a,b)=>popularity(b)-popularity(a) || order.get(a.id)-order.get(b.id) : (a,b)=>rec(b)-rec(a));
  return out;
}
function refineBar(base, shown){
  const sizes = [...new Set(base.map(i=>i.size).filter(Boolean))].sort((a,b)=>{const ix=z=>{const L=LETTERS.indexOf(z);if(L>=0)return L;const N=NUMERIC.indexOf(z);if(N>=0)return 20+N;if(z==="One size")return 40;return 50+SHOE_SIZES.indexOf(z.replace("US ",""));};return ix(a)-ix(b);});
  const colors = [...new Set(base.flatMap(i=>[...colorTags(i)]))].sort((a,b)=>{const sp=x=>x==="Print"||x==="Metallic"?1:0;return sp(a)-sp(b)||a.localeCompare(b);});
  const any = state.fSize || state.fColor;
  return `<div class="refine" role="group" aria-label="Refine">
    <label class="pick ${state.fSize?"on":""}"><select id="fSize" aria-label="Size"><option value="">Any size</option>${sizes.map(z=>`<option ${state.fSize===z?"selected":""}>${z}</option>`).join("")}</select></label>
    <label class="pick ${state.fColor?"on":""}"><select id="fColor" aria-label="Color"><option value="">Any color</option>${colors.map(c=>`<option ${state.fColor===c?"selected":""}>${c}</option>`).join("")}</select></label>
    <label class="pick"><select id="fSort" aria-label="Sort"><option value="recent" ${state.fSort==="recent"?"selected":""}>Most recent</option><option value="popular" ${state.fSort==="popular"?"selected":""}>Most popular</option></select></label>
    ${any?`<button class="clear" type="button" data-clear>Clear</button>`:""}
    <span class="count num">${shown} ${shown===1?"piece":"pieces"}</span>
  </div>`;
}

/* ============ Media renderers ============ */
function media(it, cls=""){
  if (it.img) return `<img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy">`;
  return `<div class="swatch ${it.h||"h1"} ${cls}"><div class="garment sh-${it.shape} pat-${it.pat}" style="--c1:${it.c1};--c2:${it.c2}"></div></div>`;
}
function itemStatus(it){
  const ex = exchanges();
  if (it.owner === "me"){
    const lent = ex.find(x => x.type==="lend" && x.itemId===it.id && x.status==="active");
    if (lent) return { cls:"out", text:`With ${friend(lent.other).first} since ${shortDate(lent.start)}` };
    if (!it.available) return { cls:"plain", text:"Not lending" };
    return null;
  }
  const b = ex.find(x => x.type==="borrow" && x.itemId===it.id && (x.status==="active"));
  if (b) return { cls:"in", text:"You have it" };
  const r = ex.find(x => x.type==="borrow" && x.itemId===it.id && x.status==="requested");
  if (r) return { cls:"wine", text:"Requested" };
  return null;
}
function pin(it){
  const st = itemStatus(it);
  const own = it.owner === "me" ? "Mine" : friend(it.owner).first;
  return `<button class="pin" data-open="${it.id}" aria-label="${esc(it.name)}, ${esc(own)}">
    <div class="pin-media">
      ${it.size ? `<span class="hangtag">${/^(One size|US )/.test(it.size) ? esc(it.size) : "Size "+esc(it.size)}</span>` : ""}
      ${it.owner==="me" ? "" : `<span class="save ${state.saved.has(it.id)?"on":""}" data-save="${it.id}" role="button" tabindex="-1" aria-label="${state.saved.has(it.id)?"Remove from wishlist":"Save to wishlist"}">${ICON.heart}</span>`}
      ${media(it)}
      ${st ? `<span class="status-on-media"><span class="pill ${st.cls}">${esc(st.text)}</span></span>` : ""}
    </div>
    <div class="pin-meta"><div class="min"><h3>${esc(it.name)}</h3>${it.owner==="me" ? "" : `<p>${esc(friend(it.owner).first)}’s closet</p>`}</div></div>
  </button>`;
}

/* ============ Persistence (db when available, memory otherwise) ============ */
const store = {
  async setDoc(col, id, data){
    if (db){ try { await db.collection(col).doc(id).set(data); return true; } catch(e){ toast(e?.code==="not_granted"||e?.code==="permission_denied" ? "You can browse here, but only the closet owner can save changes." : "Couldn’t save that. Check your connection and try again."); return false; } }
    return false;
  },
  async addItem(it){ if (!(await this.setDoc("items", it.id, it))) { state.added.push(it); } },
  async addRequest(r){ if (!(await this.setDoc("requests", r.id, r))) { state.requests.push(r); } },
  async setStatus(x, status){
    if (x.id.startsWith("x")){ if (!(await this.setDoc("exState", x.id, { status }))) state.overrides[x.id] = { status }; }
    else { const r = { ...state.requests.find(q=>q.id===x.id), status }; if (!(await this.setDoc("requests", x.id, r))) { const i = state.requests.findIndex(q=>q.id===x.id); state.requests[i] = r; } }
  },
  async setProfile(p){ if (!(await this.setDoc("profile", "me", p))) state.profile = p; },
  async setPref(id, patch){ const next = { ...(state.prefs[id]||{}), ...patch }; delete next.id; if (!(await this.setDoc("prefs", id, next))) state.prefs[id] = next; },
  async setAvail(id, available){ return this.setPref(id, { available }); }
};
function subscribe(){
  const sub = (col, fn) => db.collection(col).onSnapshot(snap => { fn(snap.docs.map(d => ({ id:d.id, ...d.data() }))); render(); }, () => {});
  sub("items", rows => state.added = rows.sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"")));
  sub("requests", rows => state.requests = rows);
  sub("exState", rows => { state.overrides = {}; rows.forEach(r => state.overrides[r.id] = { status:r.status }); });
  sub("wishlist", rows => { const w = rows.find(r=>r.id==="me"); if (w && Array.isArray(w.ids)) state.saved = new Set(w.ids); });
  sub("profile", rows => { state.profile = rows.find(r=>r.id==="me") || {}; });
  sub("prefs", rows => { state.prefs = {}; rows.forEach(r => { const { id, ...rest } = r; state.prefs[id] = rest; }); });
}

async function shrink(file, max=1800){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", .9));
  } finally { URL.revokeObjectURL(url); }
}
// Geometry for a frame of size W×H, from the stored zoom and pan fractions
function cropGeom(W, H){
  const a = state.add;
  const scale = Math.max(W/a.iw, H/a.ih) * a.zoom;
  const dw = a.iw*scale, dh = a.ih*scale;
  return { scale, dw, dh, tx: -a.fx*(dw-W), ty: -a.fy*(dh-H) };
}
function layoutCrop(){
  const box = $("#crop"), im = $("#cropImg"); if (!box || !im || !state.add.iw) return;
  const { width:W, height:H } = box.getBoundingClientRect();
  const g = cropGeom(W, H);
  im.style.width = g.dw+"px"; im.style.height = g.dh+"px";
  im.style.transform = `translate(${g.tx}px,${g.ty}px)`;
}
async function croppedBlob(){
  const a = state.add, Wo = 960, Ho = 1200;
  const g = cropGeom(Wo, Ho);
  const c = document.createElement("canvas"); c.width = Wo; c.height = Ho;
  c.getContext("2d").drawImage(a.img, -g.tx/g.scale, -g.ty/g.scale, Wo/g.scale, Ho/g.scale, 0, 0, Wo, Ho);
  return new Promise(res => c.toBlob(res, "image/jpeg", .88));
}
let drag = null;
document.addEventListener("pointerdown", e => {
  const box = e.target.closest?.("#crop"); if (!box) return;
  e.preventDefault(); box.setPointerCapture(e.pointerId); box.classList.add("dragging");
  drag = { x:e.clientX, y:e.clientY, fx:state.add.fx, fy:state.add.fy, box };
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const a = state.add, { width:W, height:H } = drag.box.getBoundingClientRect();
  const g = cropGeom(W, H);
  if (g.dw > W) a.fx = Math.min(1, Math.max(0, drag.fx - (e.clientX-drag.x)/(g.dw-W)));
  if (g.dh > H) a.fy = Math.min(1, Math.max(0, drag.fy - (e.clientY-drag.y)/(g.dh-H)));
  layoutCrop();
});
["pointerup","pointercancel"].forEach(ev => document.addEventListener(ev, () => { if (drag){ drag.box.classList.remove("dragging"); drag = null; } }));
document.addEventListener("wheel", e => {
  if (!e.target.closest?.("#crop")) return;
  e.preventDefault();
  const a = state.add; a.zoom = Math.min(3, Math.max(1, a.zoom * (e.deltaY < 0 ? 1.06 : 1/1.06)));
  const z = $("#crop-zoom"); if (z) z.value = a.zoom; layoutCrop();
}, { passive:false });
window.addEventListener("resize", layoutCrop);

async function handleFile(file){
  if (!file || !file.type.startsWith("image/")) { toast("Choose a photo file (JPG or PNG)."); return; }
  syncLabelFromForm();
  const a = state.add;
  try { a.blob = await shrink(file); } catch(e){ a.blob = file; }
  if (a.preview) URL.revokeObjectURL(a.preview);
  a.preview = URL.createObjectURL(a.blob);
  a.img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = a.preview; });
  if (!a.img){ toast("That photo couldn’t be opened. Try a JPG or PNG."); a.preview = null; render(); return; }
  a.iw = a.img.naturalWidth; a.ih = a.img.naturalHeight; a.zoom = 1; a.fx = .5; a.fy = .5; a.error = null;
  render();
}

/* ============ AI auto-fill (only when asked) ============ */
async function autofill(){
  const a = state.add;
  syncLabelFromForm();
  a.busy = true; a.error = null; render();
  try {
    const s = sampleApi || await claude.use("sample");
    if (!s) throw { code:"unavailable" };
    const lim = await s.limits();
    if (!lim?.images) throw { code:"images_unavailable" };
    const prompt = `You catalogue clothing for Closet Swap, an app where friends lend each other clothes. The attached image is a photo the closet owner took of a piece they own. Label the single most prominent clothing item or accessory (if a full outfit is shown, pick the standout piece; ignore the person).
Reply with JSON only, exactly this shape:
{"name":"2-4 word product name in Title Case, e.g. 'Floral Lace Mini'",
"category":"one of Dresses, Tops, Pants, Shorts, Skirts, Shoes, Accessories (coats, jackets and cardigans count as Tops)",
"color":"main color in 1-3 words",
"colorHex":"#rrggbb main color",
"description":"one friendly sentence under 18 words about the piece and when to wear it"}
If there is no clothing in the photo, return {"name":"","description":""}.`;
    const out = await s.json(prompt, { images:[await croppedBlob()], modelTier:"default" });
    if (!out || typeof out !== "object") throw { code:"bad" };
    if (!out.name) a.error = "I couldn’t find a clothing item in this photo. Try repositioning it, or fill in the details yourself.";
    else {
      const L = a.label;
      L.name = out.name; L.description = out.description || L.description; L.color = out.color || L.color;
      if (CATS.includes(out.category) && out.category !== "All"){ L.category = out.category; if (!L.size || !sizeOptions(L.category).includes(L.size)) L.size = sizeFor(L.category, state.profile) || (L.category==="Accessories" ? "One size" : ""); }
      L.colorHex = out.colorHex || "";
    }
  } catch(e){
    const code = e?.code;
    a.error = code==="not_granted" ? "Auto-fill needs permission to send the photo to Claude. Allow it from this page’s Permissions menu, or fill in the details yourself."
      : code==="rate_limited" ? "The assistant is busy. Give it a minute and try again."
      : code==="images_unavailable"||code==="unavailable" ? "Auto-fill isn’t available in this view. Fill in the details yourself."
      : "The assistant couldn’t read this photo. Try again, or fill in the details yourself.";
  }
  a.busy = false; render();
}
async function saveNew(){
  const a = state.add, v = id => $(id).value.trim();
  if (!$("#f-size").value){ toast("Pick a size first."); $("#f-size").focus(); return; }
  if (!$("#f-cat").value){ toast("Pick a category first."); $("#f-cat").focus(); return; }
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Adding…";
  const blob = await croppedBlob();
  let img = URL.createObjectURL(blob), assetId = null;
  if (assets){ try { const up = await assets.upload(blob); img = up.url; assetId = up.id; } catch(e){ /* keep local copy */ } }
  const it = { id:"a"+uid(), name:v("#f-name")||"Untitled piece", description:v("#f-desc"), color:v("#f-color"), size:$("#f-size").value,
    category:$("#f-cat").value, colorHex:a.label?.colorHex||"", img, assetId, available:true, createdAt:new Date().toISOString() };
  await store.addItem(it);
  if (a.preview) URL.revokeObjectURL(a.preview);
  state.add = { phase:"empty", blob:null, preview:null, label:{}, error:null, busy:false, img:null, iw:0, ih:0, zoom:1, fx:.5, fy:.5 };
  state.myCat = "All";
  location.hash = "#closet";
  toast(!assetId && !db ? `Added “${it.name}”. It stays for this visit only.` : `Added “${it.name}” to your closet`);
}

/* ============ Render & routing ============ */
const ROUTES = { home:viewHome, friends:viewFriends, closet:viewCloset, swaps:viewSwaps, add:viewAdd, profile:viewProfile, wishlist:viewWishlist };
function route(){ const r = location.hash.replace("#",""); return ROUTES[r] ? r : "home"; }
let lastRoute = null;
function render(){
  const r = route();
  const focusId = document.activeElement?.id, caret = document.activeElement?.selectionStart;
  renderTabs(r);
  $("#app").innerHTML = ROUTES[r]();
  if (focusId && $("#"+focusId) && r===lastRoute){ const el = $("#"+focusId); el.focus(); try { if (caret!=null) el.setSelectionRange(caret, caret); } catch(e){} }
  if (r==="add") layoutCrop();
  if (r !== lastRoute) window.scrollTo(0,0);
  lastRoute = r;
}
window.addEventListener("hashchange", () => { closeModal(); render(); });

/* ============ Events ============ */
document.addEventListener("click", async e => {
  const t = e.target;
  const save = t.closest("[data-save]");
  if (save){ e.preventDefault(); e.stopPropagation(); toggleSave(save.dataset.save); return; }
  const open = t.closest("[data-open]"); if (open){ openItem(open.dataset.open); return; }
  if (t.closest("[data-close]") || t.id === "scrim"){ closeModal(); return; }
  const ed = t.closest("[data-edit]"); if (ed){ const f = $("#editForm"); f.hidden = !f.hidden; if (!f.hidden) $("#e-name").focus(); return; }
  if (t.closest("[data-remove]")){ $("#rmConfirm").hidden = false; return; }
  const ry = t.closest("[data-remove-yes]"); if (ry){ const it = itemById(ry.dataset.removeYes); await store.setPref(ry.dataset.removeYes, { removed:true }); closeModal(); render(); toast(`Removed “${it?.name}”`); return; }
  const fr = t.closest("[data-friend]"); if (fr){ state.friendFilter = fr.dataset.friend || null; render(); return; }
  const cat = t.closest("[data-cat]"); if (cat){ state.catFilter = cat.dataset.cat; render(); return; }
  if (t.closest("[data-clear]")){ state.fSize = ""; state.fColor = ""; render(); return; }
  const mc = t.closest("[data-mycat]"); if (mc){ state.myCat = mc.dataset.mycat; render(); return; }
  const act = t.closest("[data-act]");
  if (act){
    const a = act.dataset.act;
    if (a==="autofill"){ if (!state.add.busy) autofill(); return; }
    const x = exchanges().find(q => q.id === act.dataset.x); if (!x) return;
    const it = itemById(x.itemId), who = friend(x.other).first;
    const map = { approve:["active",`Approved. ${who} can pick up the ${it.name} ${fmt(x.start)}.`], decline:["declined",`Declined ${who}’s request.`],
      returned:["returned",`Marked returned to ${who}.`], gotback:["returned",`Welcome home, ${it.name}.`], cancel:["cancelled","Request cancelled."] };
    act.disabled = true;
    await store.setStatus(x, map[a][0]); toast(map[a][1]); render();
  }
});
document.addEventListener("keydown", e => {
  if (e.key==="Escape") closeModal();
});
function syncLabelFromForm(){
  if (!$("#f-name")) return;
  const L = state.add.label = state.add.label || {}; const g = id => $(id)?.value;
  Object.assign(L, { name:g("#f-name"), description:g("#f-desc"), color:g("#f-color"), size:g("#f-size")||"", category:g("#f-cat")||"" });
}
document.addEventListener("input", e => {
  if (e.target.id==="q"){ state.query = e.target.value; render(); }
  if (e.target.id==="crop-zoom"){ state.add.zoom = +e.target.value; layoutCrop(); }
});
document.addEventListener("change", async e => {
  if (e.target.id==="photo"){ handleFile(e.target.files[0]); }
  if (e.target.id==="fSize"){ state.fSize = e.target.value; render(); return; }
  if (e.target.id==="fColor"){ state.fColor = e.target.value; render(); return; }
  if (e.target.id==="fSort"){ state.fSort = e.target.value; render(); return; }
  if (e.target.id==="e-cat"){ const sel = $("#e-size"), opts = sizeOptions(e.target.value); sel.innerHTML = opts.map(z=>`<option>${z}</option>`).join(""); const d = sizeFor(e.target.value, state.profile); if (d) sel.value = d; }
  if (e.target.id==="f-cat"){ syncLabelFromForm(); const L = state.add.label;
    if (!sizeOptions(L.category).includes(L.size)) L.size = "";
    if (!L.size) L.size = sizeFor(L.category, state.profile) || (L.category==="Accessories" ? "One size" : "");
    render(); }
  if (e.target.dataset.avail){ const id = e.target.dataset.avail, on = e.target.checked; await store.setAvail(id, on); toast(on ? "Friends can request this piece." : "Hidden from friends’ requests."); render(); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id==="addForm"){ syncLabelFromForm(); saveNew(); }
  if (e.target.id==="editForm"){
    const id = e.target.dataset.item;
    await store.setPref(id, { name:$("#e-name").value.trim()||"Untitled piece", description:$("#e-desc").value.trim(), color:$("#e-color").value.trim(), size:$("#e-size").value, category:$("#e-cat").value });
    closeModal(); render(); openItem(id); toast("Saved");
  }
  if (e.target.id==="profileForm"){
    const g = n => e.target.querySelector(`input[name="p-${n}"]:checked`)?.value || "";
    const p = { ft:$("#p-ft").value, in:$("#p-in").value };
    PROFILE_FIELDS.forEach(f => p[f.id] = g(f.id));
    await store.setProfile(p); toast("Profile saved"); render();
  }
  if (e.target.id==="reqForm"){
    const id = e.target.dataset.item, it = itemById(id), start = $("#r-start").value;
    await store.addRequest({ id:"r"+uid(), itemId:id, other:it.owner, start, note:$("#r-note").value.trim(), status:"requested", createdAt:new Date().toISOString() });
    closeModal(); render(); toast(`Request sent to ${friend(it.owner).first}`);
  }
});
["dragover","dragenter"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest?.("#drop"); if (d){ e.preventDefault(); d.classList.add("over"); } }));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest?.("#drop"); if (d){ d.classList.remove("over"); if (ev==="drop"){ e.preventDefault(); handleFile(e.dataTransfer.files[0]); } } }));

/* ============ Boot ============ */
render();
(async () => {
  if (!window.claude?.use) return;
  const [d, as, sm] = await Promise.all([claude.use("db"), claude.use("assets"), claude.use("sample")]);
  db = d; assets = as; sampleApi = sm;
  if (db) subscribe();
})();
</script>
